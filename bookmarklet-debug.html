<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xの横幅チェックくん - デバッグ版</title>
  <style>
    body {
      font-family: 'Comic Sans MS', 'Hiragino Maru Gothic Pro', 'Meiryo', sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(145deg, #fff5f8, #f0f9ff);
      border-radius: 20px;
    }
    h1 {
      color: #ff6b9d;
      text-align: center;
    }
    .bookmarklet-link {
      display: inline-block;
      padding: 15px 30px;
      background: linear-gradient(135deg, #ff6b9d, #ffa8c5);
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: move;
    }
    .test-area {
      background: white;
      padding: 30px;
      border-radius: 16px;
      border: 2px solid #ffd4e5;
      margin: 30px 0;
    }
    .test-text {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 12px;
      line-height: 2;
      user-select: text;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <h1>📏 Xの横幅チェックくん（デバッグ版）</h1>

  <div style="text-align: center; margin: 30px 0;">
    <a id="bookmarklet" href="" class="bookmarklet-link">📏 横幅チェックくん（デバッグ）</a>
  </div>

  <div class="test-area">
    <h2 style="color: #ff6b9d;">テスト用テキスト</h2>
    <div class="test-text">
この行は14文字です
この行は17文字なので黄色
この行は20文字を超えるのでピンク色です
短いよ
    </div>
    <p style="margin-top: 20px;">
      1. 上のボタンをブックマークバーにドラッグ<br>
      2. ブックマークレットをクリック<br>
      3. 上のテキストを選択<br>
      4. <strong>F12キー</strong>を押してConsoleタブを見る
    </p>
  </div>

  <script>
    // デバッグ版：console.logで動作確認
    const bookmarkletCode = `javascript:(function(){
      console.log('=== Xの横幅チェックくん デバッグ版 ===');
      if(window.xccBookmarklet){
        alert('既に起動しています！');
        return;
      }
      window.xccBookmarklet=true;

      // スタイル追加
      const style=document.createElement('style');
      style.textContent='.xcc-hl{position:absolute;border-radius:4px;opacity:0.4;pointer-events:none;z-index:9999}.xcc-hl.blue{background:linear-gradient(135deg,rgba(173,216,230,0.7),rgba(176,224,230,0.6))}.xcc-hl.yellow{background:linear-gradient(135deg,rgba(255,218,185,0.7),rgba(255,228,196,0.6))}.xcc-hl.red{background:linear-gradient(135deg,rgba(255,192,203,0.7),rgba(255,182,193,0.6))}.xcc-badge{position:absolute;padding:4px 10px;border-radius:12px;font:700 12px sans-serif;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.15);pointer-events:none;z-index:10000}.xcc-badge.blue{background:linear-gradient(135deg,#add8e6,#b0e0e6);color:#2c5f7a;border:2px solid #87ceeb}.xcc-badge.yellow{background:linear-gradient(135deg,#ffdab9,#ffe4c4);color:#8b5a00;border:2px solid #ffb84d}.xcc-badge.red{background:linear-gradient(135deg,#ffc0cb,#ffb6c1);color:#8b3a62;border:2px solid #ff69b4}.xcc-tip{position:absolute;z-index:999999;background:#fff;border:2px solid #ffd4e5;border-radius:16px;padding:16px;font:14px sans-serif;min-width:160px;pointer-events:none}.xcc-tip .total{font:700 16px sans-serif;color:#ff6b9d;text-align:center}';
      document.head.appendChild(style);
      console.log('✓ スタイル追加完了');

      let tip=null,els=[];

      const cc=t=>{let n=0;for(let c of t)n+=c.match(/[\\u0000-\\u007F]/)?0.5:1;return Math.ceil(n)};
      const gc=n=>n<=15?'blue':n<=17?'yellow':'red';
      const clr=()=>{els.forEach(e=>e&&e.remove());els=[];if(tip){tip.remove();tip=null}};

      const sel=()=>{
        console.log('--- テキスト選択イベント ---');
        const s=window.getSelection();
        const t=s.toString();
        console.log('選択テキスト:', t);

        if(!t||!t.trim()){
          clr();
          return;
        }

        clr();

        const ls=t.split('\\n').filter(l=>l.trim());
        console.log('行数:', ls.length);
        console.log('各行:', ls);

        const stats=ls.map(l=>{
          const count=cc(l.trim());
          const color=gc(count);
          console.log('  行:"'+l.trim()+'" → '+count+'文字 ('+color+')');
          return {c:count,cl:color};
        });

        const tc=cc(t);
        console.log('合計文字数:', tc);

        let lastRect=null;

        if(s.rangeCount){
          const rg=s.getRangeAt(0);
          const rcs=rg.getClientRects();
          console.log('矩形数:', rcs.length);

          if(rcs.length){
            const lrs=[];
            let cy=null,cg=[];

            Array.from(rcs).forEach(r=>{
              if(!r.width||!r.height)return;
              const y=Math.round(r.top);
              if(cy===null||Math.abs(y-cy)<5){
                cg.push(r);
                cy=y;
              }else{
                if(cg.length)lrs.push(cg);
                cg=[r];
                cy=y;
              }
            });
            if(cg.length)lrs.push(cg);

            console.log('行グループ数:', lrs.length);

            lrs.forEach((rs,i)=>{
              const st=stats[Math.min(i,stats.length-1)];
              const lastRectInLine=rs[rs.length-1];

              console.log('  行'+i+': 矩形'+rs.length+'個, 文字数='+st.c+', 色='+st.cl);

              rs.forEach(r=>{
                const h=document.createElement('div');
                h.className='xcc-hl '+st.cl;
                h.style.cssText='position:absolute;left:'+(r.left+scrollX)+'px;top:'+(r.top+scrollY)+'px;width:'+r.width+'px;height:'+r.height+'px';
                document.body.appendChild(h);
                els.push(h);
              });

              const b=document.createElement('div');
              b.className='xcc-badge '+st.cl;
              b.textContent=st.c+'文字';
              b.style.cssText='position:absolute;left:'+(lastRectInLine.right+scrollX+8)+'px;top:'+(lastRectInLine.top+scrollY)+'px';
              document.body.appendChild(b);
              els.push(b);
              console.log('  バッジ作成:', st.c+'文字', 'at', (lastRectInLine.right+scrollX+8), (lastRectInLine.top+scrollY));

              lastRect={l:lastRectInLine.right+scrollX+8,t:lastRectInLine.top+scrollY,b:lastRectInLine.bottom+scrollY};
            });

            if(lastRect){
              tip=document.createElement('div');
              tip.className='xcc-tip';
              tip.innerHTML='<div class="total">合計: '+tc+'文字 / 140</div>';
              document.body.appendChild(tip);
              tip.style.cssText='position:absolute;left:'+lastRect.l+'px;top:'+(lastRect.b+8)+'px';
              console.log('✓ ツールチップ作成');
            }
          }
        }

        console.log('バッジ総数:', els.filter(e=>e.className.includes('badge')).length);
      };

      document.addEventListener('mouseup',()=>setTimeout(sel,10));
      document.addEventListener('mousedown',e=>{if(tip&&!tip.contains(e.target))clr()});
      document.addEventListener('keydown',e=>{if(e.key==='Escape')clr()});

      console.log('✓ イベントリスナー登録完了');
      alert('Xの横幅チェックくん（デバッグ版）を起動しました！\\nF12キーでConsoleを開いてください。');
    })();`;

    document.getElementById('bookmarklet').href = bookmarkletCode;
  </script>
</body>
</html>
